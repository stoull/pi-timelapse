[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-timelapse"
version = "0.1.0"
description = "Raspberry Pi Camera Module 3 timelapse control system"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "astral>=3.2",
  "fastapi>=0.115",
  "jinja2>=3.1",
  "Pillow>=8.1",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = ["httpx>=0.27", "pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
timelapse = "timelapse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"timelapse.web" = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
