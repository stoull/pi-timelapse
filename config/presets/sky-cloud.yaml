name: 天空云层
summary: 白天流云，锁定日光白平衡，自动曝光略压暗以保住云层层次。
mode: sky
capture:
  interval_sec: 8
  still_config: {main_size: [3840, 2160], jpeg_quality: 95}
window:
  type: solar
  latitude: 31.23
  longitude: 121.47
  timezone: Asia/Shanghai
  solar: {start: sunrise, start_offset_min: -20, end: sunset, end_offset_min: 20}
camera:
  lens: standard
  af_mode: auto_once
  lens_position: 0
  af_range: full
  af_speed: normal
  ae_enable: true
  exposure_time_us: 2000
  analogue_gain: 1
  exposure_value: -0.375
  awb_enable: false
  awb_mode: daylight
  colour_gains: [1.55, 1.5]
  brightness: 0
  contrast: 1.1
  saturation: 1.05
  sharpness: 1.1
  hdr: false
  camera_led: false
encode: {fps: 24, height: 1080, crf: 18}
