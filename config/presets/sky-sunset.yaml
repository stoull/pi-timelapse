name: 日落晚霞
summary: 日落前后天空色彩变化，压暗半档保住晚霞，锁定暖调日光白平衡。
mode: sky
capture:
  interval_sec: 4
  still_config: {main_size: [3840, 2160], jpeg_quality: 95}
window:
  type: solar
  latitude: 31.23
  longitude: 121.47
  timezone: Asia/Shanghai
  solar: {start: sunset, start_offset_min: -45, end: sunset, end_offset_min: 25}
camera:
  lens: standard
  af_mode: auto_once
  lens_position: 0
  af_range: full
  af_speed: normal
  ae_enable: true
  exposure_time_us: 8000
  analogue_gain: 1
  exposure_value: -0.75
  awb_enable: false
  awb_mode: daylight
  colour_gains: [1.75, 1.35]
  brightness: 0
  contrast: 1.2
  saturation: 1.2
  sharpness: 1.05
  hdr: false
  camera_led: false
encode: {fps: 24, height: 1080, crf: 18}
