name: 街道人流
summary: 路口或广场人流，短间隔广角，自动曝光，锁定日光白平衡。
mode: life
capture:
  interval_sec: 2
  still_config: {main_size: [2304, 1296], jpeg_quality: 90}
window:
  type: clock
  timezone: Asia/Shanghai
  clock: {start: "08:00", end: "20:00"}
camera:
  lens: wide
  af_mode: auto_once
  lens_position: 1
  af_range: full
  af_speed: fast
  ae_enable: true
  exposure_time_us: 4000
  analogue_gain: 1
  exposure_value: 0
  awb_enable: false
  awb_mode: daylight
  colour_gains: [1.6, 1.5]
  brightness: 0
  contrast: 1.05
  saturation: 1
  sharpness: 1.05
  hdr: false
  camera_led: false
encode: {fps: 24, height: 1080, crf: 18}
