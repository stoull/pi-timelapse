name: 天空黄金时段
summary: 日出前后暖色光，自动曝光并略降曝光补偿，锁定日光白平衡。
mode: sky
capture:
  interval_sec: 5
  still_config: {main_size: [3840, 2160], jpeg_quality: 95}
window:
  type: solar
  latitude: 31.23
  longitude: 121.47
  timezone: Asia/Shanghai
  solar: {start: sunrise, start_offset_min: -30, end: sunrise, end_offset_min: 60}
camera:
  lens: standard
  af_mode: auto_once
  lens_position: 0
  af_range: full
  af_speed: normal
  ae_enable: true
  exposure_time_us: 5000
  analogue_gain: 1
  exposure_value: -0.5
  awb_enable: false
  awb_mode: daylight
  colour_gains: [1.7, 1.4]
  brightness: 0
  contrast: 1.15
  saturation: 1.15
  sharpness: 1
  hdr: false
  camera_led: false
encode: {fps: 24, height: 1080, crf: 18}
