name: 车流光轨
summary: 路口或高架夜拍，关闭自动曝光，用约 0.4 秒快门拉出车灯轨迹。
mode: life
capture:
  interval_sec: 3
  still_config: {main_size: [3840, 2160], jpeg_quality: 92}
window:
  type: clock
  timezone: Asia/Shanghai
  clock: {start: "18:00", end: "23:00"}
camera:
  lens: wide
  af_mode: auto_once
  lens_position: 0
  af_range: full
  af_speed: normal
  ae_enable: false
  exposure_time_us: 400000
  analogue_gain: 1.2
  exposure_value: 0
  awb_enable: false
  awb_mode: tungsten
  colour_gains: [1.4, 1.8]
  brightness: -0.05
  contrast: 1.2
  saturation: 1.1
  sharpness: 1.15
  hdr: false
  camera_led: false
encode: {fps: 24, height: 1080, crf: 18}
