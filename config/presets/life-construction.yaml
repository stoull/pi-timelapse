name: 工地建设
summary: 工程进度跨日记录，工作时段拍摄，自动曝光，锁定日光白平衡。
mode: life
capture:
  interval_sec: 180
  still_config: {main_size: [3840, 2160], jpeg_quality: 92}
window:
  type: clock
  timezone: Asia/Shanghai
  clock: {start: "07:00", end: "19:00"}
camera:
  lens: standard
  af_mode: auto_once
  lens_position: 1
  af_range: full
  af_speed: normal
  ae_enable: true
  exposure_time_us: 4000
  analogue_gain: 1
  exposure_value: 0
  awb_enable: false
  awb_mode: daylight
  colour_gains: [1.6, 1.5]
  brightness: 0
  contrast: 1.05
  saturation: 1
  sharpness: 1.1
  hdr: false
  camera_led: false
encode: {fps: 24, height: 1080, crf: 18}
